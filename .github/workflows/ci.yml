name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download dependencies
        run: |
          mkdir -p lib test-lib
          curl -fsSL -o lib/servlet-api.jar https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/3.1.0/javax.servlet-api-3.1.0.jar
          curl -fsSL -o test-lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o test-lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile main sources
        run: |
          mkdir -p build/classes
          find Commuto/src/java -name "*.java" > sources.txt
          javac -encoding UTF-8 -cp "lib/servlet-api.jar" -d build/classes @sources.txt

      - name: Compile tests
        run: |
          mkdir -p build/test-classes
          javac -encoding UTF-8 -cp "build/classes:test-lib/junit-4.13.2.jar:test-lib/hamcrest-core-1.3.jar" -d build/test-classes Commuto/test/util/PasswordUtilTest.java

      - name: Run tests
        run: java -cp "build/classes:build/test-classes:test-lib/junit-4.13.2.jar:test-lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore util.PasswordUtilTest
